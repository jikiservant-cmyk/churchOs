name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: SQL schema + RLS/RPC probes (PGlite)
        run: npm run test:db
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true # postcss-in-next advisory needs Next 16; see README
